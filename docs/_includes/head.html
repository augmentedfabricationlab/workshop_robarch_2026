<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title == "About" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.title }} — {{ site.title }}, {{ site.tagline }}">

  <!-- Emoji favicon, inline SVG data URI. No image file, no extra request.
       To swap it, replace the %F0%... sequence just before %3C%2Ftext%3E:
       🪚  saw      = %F0%9F%AA%9A
       🪵  wood     = %F0%9F%AA%B5
       🔨  hammer   = %F0%9F%94%A8
       🤖  robot    = %F0%9F%A4%96
       🩹  bandage  = %F0%9F%A9%B9 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%AA%9A%3C%2Ftext%3E%3C%2Fsvg%3E">

  <!-- CSS (vendored, no build step, no external theme gem) -->
  <link rel="stylesheet" href="{{ '/public/css/poole.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/hyde.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/workshop.css' | relative_url }}">
</head>
